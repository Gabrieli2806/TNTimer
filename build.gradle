plugins {
	id 'java'
}

group = project.mod_group_id
version = project.mod_version
base.archivesName = "${project.mod_id}-plugin"

repositories {
	mavenCentral()
	maven { name = 'Spigot'; url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
	maven { name = 'Sonatype'; url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

dependencies {
	compileOnly "org.spigotmc:spigot-api:${project.spigot_api_version}"
}

java {
	// Compile with a current JDK (the API jar is Java 21 bytecode) but emit Java 8 class files.
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = project.java_version as int
	options.compilerArgs << '-Xlint:-options'
}

processResources {
	var replacements = [version: project.mod_version, description: project.mod_description, authors: project.mod_authors]
	inputs.properties replacements
	filesMatching('plugin.yml') { expand replacements }
}
