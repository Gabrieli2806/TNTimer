subprojects {
	apply plugin: 'java'

	group = project.mod_group_id
	version = project.mod_version

	base {
		archivesName = "${project.mod_id}-${project.name}"
	}

	repositories {
		mavenCentral()
		maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
		// FML before 1.7 reads mod classes with ASM 4, which only understands Java 7 class files.
		sourceCompatibility = JavaVersion.VERSION_1_7
		targetCompatibility = JavaVersion.VERSION_1_7
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
	}

	tasks.withType(ProcessResources).configureEach {
		var replacements = [
				mod_id         : project.mod_id,
				mod_name       : project.mod_name,
				mod_version    : project.mod_version,
				mod_authors    : project.mod_authors,
				mod_description: project.mod_description,
				minecraft_version: project.minecraft_version,
		]
		it.inputs.properties replacements
		it.filesMatching(['mcmod.info']) {
			expand replacements
		}
	}
}
