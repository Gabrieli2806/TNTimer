subprojects {
	apply plugin: 'java'

	group = project.mod_group_id
	version = project.mod_version

	base {
		archivesName = "${project.mod_id}-${project.name}"
	}

	repositories {
		mavenCentral()
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
		maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
		maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
		// Mod Menu's placeholder-api dependency
		maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' }
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		// Java 8's javac has no --release; the toolchain already pins the version there.
		if ((project.java_version as int) > 8) it.options.release = project.java_version as int
	}

	tasks.withType(ProcessResources).configureEach {
		var replacements = [
				mod_id         : project.mod_id,
				mod_name       : project.mod_name,
				mod_version    : project.mod_version,
				mod_authors    : project.mod_authors,
				mod_license    : project.mod_license,
				mod_description: project.mod_description,
				java_version   : project.java_version,
				minecraft_version   : project.minecraft_version,
				minecraft_version_min: project.minecraft_version_min,
				minecraft_version_next: project.minecraft_version_next,
				fabric_loader_version: project.fabric_loader_version,
				fabric_api_version  : project.fabric_api_version,
				modmenu_version     : project.modmenu_version,
				forge_version       : project.forge_version,
		]
		it.inputs.properties replacements
		it.filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
			expand replacements
		}
	}
}
