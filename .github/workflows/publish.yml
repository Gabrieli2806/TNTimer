name: Publish

# Publishing a GitHub release from the plugin branch builds the plugin jar and uploads it to
# Modrinth (same project as the mod, with server-plugin loaders). The changelog comes from the
# release notes. Mark the release as "pre-release" to publish as beta.
#
# CurseForge keeps Bukkit plugins in a separate project type, so the plugin isn't sent there.
#
# Needs repository secret MODRINTH_TOKEN and repository variable MODRINTH_PROJECT_ID.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    # Mod releases (mc/* branches) have their own publish workflow on those branches.
    if: startsWith(github.event.release.tag_name, 'plugin-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read gradle.properties
        id: props
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2; }
          echo "version=$(prop mod_version)" >> "$GITHUB_OUTPUT"
          echo "game_versions=>=$(prop minecraft_version_min) <=$(prop minecraft_version_max)" >> "$GITHUB_OUTPUT"
          echo "java=$(prop java_version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew build

      - name: Publish plugin
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # Unfeaturing older versions needs the PAT's "Write versions" scope; keep them featured.
          modrinth-unfeature-mode: none
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/libs/!(*-sources).jar
          name: TNTimer Plugin ${{ steps.props.outputs.version }} (Paper/Spigot)
          version: plugin-${{ steps.props.outputs.version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: |
            paper
            spigot
            bukkit
            purpur
          game-versions: ${{ steps.props.outputs.game_versions }}
          java: ${{ steps.props.outputs.java }}
