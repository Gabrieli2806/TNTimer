plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.18.3'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.x is obfuscated: compile against Mojang names, Loom remaps the jar to intermediary.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	compileOnly project(':common')
}

// MultiLoader-Template pattern: compile common's sources into this loader's jar.
tasks.named('compileJava', JavaCompile) {
	source(project(':common').sourceSets.main.allJava)
}

tasks.named('processResources', ProcessResources) {
	from project(':common').sourceSets.main.resources
}

tasks.named('sourcesJar', Jar) {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
	runs {
		client {
			client()
			ideConfigGenerated true
			runDir 'run'
		}
	}
}
