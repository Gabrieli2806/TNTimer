plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.12'
}

base {
	archivesName = "${project.mod_id}-fabric"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings needed - 26.x is unobfuscated
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	compileOnly project(':common')
}

// MultiLoader-Template pattern: compile common's sources into this loader's jar.
tasks.named('compileJava', JavaCompile) {
	source(project(':common').sourceSets.main.allJava)
}

tasks.named('processResources', ProcessResources) {
	from project(':common').sourceSets.main.resources
}

tasks.named('sourcesJar', Jar) {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
	runs {
		client {
			client()
			ideConfigGenerated true
			runDir 'run'
		}
	}
}
