plugins {
	// ForgeGradle 6 can't set up Forge 1.16.5 and ForgeGradle 5 needs Gradle 7, so this branch
	// builds the Forge jar with Unimined: Mojang names at compile time, reobfuscated to SRG,
	// with the mixin refmap generated for the shared mixins.
	id 'xyz.wagyourtail.unimined' version '1.4.1'
}

unimined.minecraft {
	version project.minecraft_version

	mappings {
		searge()
		mojmap()
	}

	minecraftForge {
		loader project.forge_version.substring(project.minecraft_version.length() + 1)
		mixinConfig "${project.mod_id}.mixins.json"
	}
}

dependencies {
	compileOnly project(':common')
}

// MultiLoader-Template pattern: compile common's sources into this loader's jar.
tasks.named('compileJava', JavaCompile) {
	source(project(':common').sourceSets.main.allJava)
}

tasks.named('processResources', ProcessResources) {
	from(project(':common').sourceSets.main.resources) {
		// Only Forge needs a refmap (SRG at runtime), so only its copy of the shared
		// mixin config points at one.
		filesMatching("${project.mod_id}.mixins.json") {
			filter { line -> line.replace('"package":', "\"refmap\": \"${project.mod_id}.refmap.json\",\n\t\"package\":") }
		}
	}
}

tasks.named('sourcesJar', Jar) {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	manifest {
		attributes['MixinConfigs'] = "${project.mod_id}.mixins.json"
	}
}
