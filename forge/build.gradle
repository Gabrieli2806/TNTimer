plugins {
	// ForgeGradle 6 can't set up Forge 1.15.2 and ForgeGradle 3 needs Gradle 4, so this branch
	// builds the Forge jar with Unimined: Mojang names at compile time, reobfuscated to SRG.
	id 'xyz.wagyourtail.unimined' version '1.4.1'
}

unimined.minecraft {
	version project.minecraft_version

	mappings {
		searge()
		mojmap()
	}

	minecraftForge {
		loader project.forge_version.substring(project.minecraft_version.length() + 1)
	}
}

dependencies {
	compileOnly project(':common')
}

// MultiLoader-Template pattern: compile common's sources into this loader's jar.
// Forge 1.15 ships no Mixin, so the shared mixins are left out and Forge events are used instead.
tasks.named('compileJava', JavaCompile) {
	source(project(':common').sourceSets.main.allJava.matching { exclude 'com/g2806/tntimer/mixin/**' })
}

tasks.named('processResources', ProcessResources) {
	from(project(':common').sourceSets.main.resources) {
		exclude "${project.mod_id}.mixins.json"
	}
}

tasks.named('sourcesJar', Jar) {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
