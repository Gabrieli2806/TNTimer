plugins {
	// Legacy Forge (1.12.2) through Unimined: MCP names at compile time, reobfuscated to SRG.
	id 'xyz.wagyourtail.unimined' version '1.4.1'
}

unimined.minecraft {
	version project.minecraft_version

	mappings {
		// Forge before 1.7 ships its own MCP names.
		forgeBuiltinMCP(project.forge_version.substring(project.minecraft_version.length() + 1))
	}

	minecraftForge {
		loader project.forge_version.substring(project.minecraft_version.length() + 1)
	}
}

dependencies {
	compileOnly project(':common')
}

// MultiLoader-Template pattern: compile common's sources into this loader's jar.
tasks.named('compileJava', JavaCompile) {
	source(project(':common').sourceSets.main.allJava)
}

tasks.named('processResources', ProcessResources) {
	from project(':common').sourceSets.main.resources
}

tasks.named('sourcesJar', Jar) {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
