plugins {
	// Forge 1.21.x uses ForgeGradle 7 with official (Mojang) mappings.
	id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

minecraft {
	mappings channel: 'official', version: project.minecraft_version

	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
			systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
		}

		register('client') {
			// Forge detects mixin configs from the jar manifest; dev runs need the flag.
			args "--mixin.config=${project.mod_id}.mixins.json"
		}
	}
}

jar {
	manifest {
		attributes['MixinConfigs'] = "${project.mod_id}.mixins.json"
	}
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${project.forge_version}")

	compileOnly project(':common')
}

// MultiLoader-Template pattern: compile common's sources into this loader's jar.
tasks.named('compileJava', JavaCompile) {
	source(project(':common').sourceSets.main.allJava)
}

tasks.named('processResources', ProcessResources) {
	from project(':common').sourceSets.main.resources
}

tasks.named('sourcesJar', Jar) {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
