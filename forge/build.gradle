plugins {
	// Forge 1.20.2 - 1.20.4 runs on SRG names: ForgeGradle 6 reobfuscates the jar, and
	// MixinGradle generates the refmap so the shared mixins resolve at runtime.
	id 'net.minecraftforge.gradle' version '6.0.54'
	id 'org.spongepowered.mixin' version '0.7.38'
}

minecraft {
	mappings channel: 'official', version: project.minecraft_version

	runs {
		client {
			workingDirectory project.file('run')
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			args '--mixin.config', "${project.mod_id}.mixins.json"

			mods {
				"${project.mod_id}" {
					source sourceSets.main
				}
			}
		}
	}
}

// ForgeGradle 6 dev runs load classes and resources as one module; give them one output dir.
sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/${it.name}")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}

mixin {
	add sourceSets.main, "${project.mod_id}.refmap.json"
	config "${project.mod_id}.mixins.json"
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.forge_version}"
	annotationProcessor "org.spongepowered:mixin:${project.forge_mixin_version}:processor"

	compileOnly project(':common')
}

// MultiLoader-Template pattern: compile common's sources into this loader's jar.
tasks.named('compileJava', JavaCompile) {
	source(project(':common').sourceSets.main.allJava)
}

tasks.named('processResources', ProcessResources) {
	from(project(':common').sourceSets.main.resources) {
		// Only Forge needs a refmap (SRG at runtime), so only its copy of the shared
		// mixin config points at one.
		filesMatching("${project.mod_id}.mixins.json") {
			filter { line -> line.replace('"package":', "\"refmap\": \"${project.mod_id}.refmap.json\",\n\t\"package\":") }
		}
	}
}

tasks.named('sourcesJar', Jar) {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	manifest {
		attributes['MixinConfigs'] = "${project.mod_id}.mixins.json"
	}
	finalizedBy 'reobfJar'
}
