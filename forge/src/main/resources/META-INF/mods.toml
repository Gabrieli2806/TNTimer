modLoader = "javafml"
loaderVersion = "[50,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Gabrieli2806/TNTimer/issues"
clientSideOnly = true

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "assets/tntimer/icon.png"
displayURL = "https://modrinth.com/mod/tntimer"

[[dependencies.${mod_id}]]
	modId = "forge"
	mandatory = true
	versionRange = "[50,)"
	ordering = "NONE"
	side = "CLIENT"

[[dependencies.${mod_id}]]
	modId = "minecraft"
	mandatory = true
	versionRange = "[${minecraft_version_min},${minecraft_version_next})"
	ordering = "NONE"
	side = "CLIENT"
