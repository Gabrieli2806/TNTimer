org.gradle.jvmargs=-Xmx2G

# ---- Plugin ----
mod_id=tntimer
mod_name=TNTimer
mod_version=1.0.0
mod_group_id=com.g2806.tntimer
mod_authors=Gabrieli2806
mod_license=MIT
mod_description=Server-side plugin that shows a countdown above lit TNT (and primed sulfur cubes on 26.2+). Players need no mod.

# One jar for every server from 1.8.8 up: compiled against the newest Spigot API,
# but only touching API that old servers have (newer features are detected at runtime).
spigot_api_version=1.21.11-R0.1-SNAPSHOT
# Bytecode level: Java 8 so 1.8 - 1.16 servers can load it.
java_version=8

# Version range advertised on Modrinth (publish.yml).
minecraft_version_min=1.8.8
minecraft_version_max=26.3
