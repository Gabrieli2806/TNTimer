org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod
mod_id=tntimer
mod_name=TNTimer
mod_version=3.0.0
mod_group_id=com.g2806.tntimer
mod_authors=Gabrieli2806
mod_license=MIT
mod_description=This Client-Side mod adds a countdown timer that shows exactly when the most recently placed TNT will explode.

# Common
minecraft_version=1.6.4
# Lowest MC version this build supports (lower bound in metadata and on Modrinth/CurseForge)
minecraft_version_min=1.6.4
# First version this build does NOT support
minecraft_version_next=1.7
java_version=8
# MCP mappings used at compile time (Forge legacy runs on SRG names)
mcp_channel=stable
mcp_version=12-1.7.10

# Forge
forge_version=1.6.4-9.11.1.1345
