plugins {
	id 'net.neoforged.moddev' version '2.0.148'
}

neoForge {
	// Vanilla-only (NeoForm) mode: common compiles against plain Minecraft.
	neoFormVersion = project.neoform_version
}

dependencies {
	// Annotations only; non-transitive so its ASM version can't clash with Minecraft's pinned one.
	compileOnly("net.fabricmc:sponge-mixin:${project.mixin_version}") { transitive = false }
}
