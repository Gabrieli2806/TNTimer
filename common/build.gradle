plugins {
	id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

legacyForge {
	// Vanilla-only (MCP) mode: common compiles against plain Minecraft with Mojang names.
	mcpVersion = project.minecraft_version
}

dependencies {
	// Annotations only; non-transitive so its ASM version can't clash with Minecraft's pinned one.
	compileOnly("net.fabricmc:sponge-mixin:${project.mixin_version}") { transitive = false }
}
