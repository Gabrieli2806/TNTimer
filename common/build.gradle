plugins {
	id 'xyz.wagyourtail.unimined' version '1.4.1'
}

// Vanilla Minecraft with MCP names; loader modules recompile these sources.
unimined.minecraft {
	version project.minecraft_version
	side 'client'

	mappings {
		// Forge before 1.7 ships its own MCP names.
		searge()
		forgeBuiltinMCP(project.forge_version.substring(project.minecraft_version.length() + 1))
	}
}
